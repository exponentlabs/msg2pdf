name: Publish verified prerelease
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag and draft prerelease to publish
        required: true
        type: string
      run_id:
        description: Successful manual main-branch CI run with installers enabled (within three days)
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: prerelease-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Read the requested build, tag and draft release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > build.json
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" > tag.json
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName > release.json
      - name: Download explicit installer provenance
        run: gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name installer-source --dir artifacts/installer-source
      - name: Verify the manual build, current attempt and exact tag
        run: node scripts/ci-policy.cjs verify-release
      - name: Download verified installers
        run: gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'installers-*' --dir artifacts
      - name: Collect all platforms and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          cp artifacts/installers-Windows-X64/*.exe release-assets/
          cp artifacts/installers-macOS-ARM64/*.dmg artifacts/installers-macOS-ARM64/*.zip release-assets/
          cp artifacts/installers-macOS-X64/*.dmg artifacts/installers-macOS-X64/*.zip release-assets/
          test "$(find release-assets -type f | wc -l)" -eq 5
          cd release-assets
          sha256sum *.dmg *.zip *.exe > SHA256SUMS.txt
      - name: Attach installers and checksums
        run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Verify uploaded sizes and digests before publishing
        shell: bash
        run: |
          set -euo pipefail
          release_id=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > uploaded.json
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const release = JSON.parse(fs.readFileSync('uploaded.json'));
          const files = fs.readdirSync('release-assets');
          assert.equal(release.assets.length, files.length);
          for (const name of files) {
            const bytes = fs.readFileSync(`release-assets/${name}`);
            const asset = release.assets.find(asset => asset.name === name);
            assert.ok(asset, `Missing release asset: ${name}`);
            assert.equal(asset.state, 'uploaded');
            assert.equal(asset.size, bytes.length);
            assert.equal(asset.digest, `sha256:${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          }
          JS
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
