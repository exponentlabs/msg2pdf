name: Verify and package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      installers:
        description: Build review installers (three-day retention; never publish)
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  # Routine pushes must not cancel an explicitly requested installer build.
  group: verify-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.installers && 'installers' || 'checks' }}
  cancel-in-progress: true
jobs:
  checks:
    name: Source and documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      native: ${{ steps.changes.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Classify changes
        id: changes
        run: node scripts/ci-policy.cjs changes
      - run: pnpm lint
      - run: pnpm docs:check
      - run: pnpm typecheck
        if: steps.changes.outputs.native == 'true'
      - run: pnpm audit:production
        if: steps.changes.outputs.native == 'true'
      - name: Create one source snapshot and installer provenance
        if: github.event_name == 'workflow_dispatch' && inputs.installers
        run: |
          pnpm source:archive
          node scripts/ci-policy.cjs provenance
      - name: Upload installer source and provenance
        if: github.event_name == 'workflow_dispatch' && inputs.installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-source
          path: |
            release/msg2pdf-source.tar.gz
            installer-build.json
          retention-days: 3
          overwrite: true
          if-no-files-found: error

  verify:
    needs: checks
    if: needs.checks.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          desktop: "true"
      - run: pnpm test
      - run: pnpm build
      - name: Real Electron tests
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - name: Real Electron tests with display server
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e
      - name: Build portable app
        run: pnpm exec electron-builder --config electron-builder.config.cjs --dir --publish never
      - name: Configure the packaged Chromium sandbox on the ephemeral Linux runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
      - name: Verify bundled app runtime
        if: runner.os != 'Linux'
        run: pnpm test:packaged
      - name: Verify bundled app runtime with display server
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:packaged
      - name: Build requested review installers
        if: github.event_name == 'workflow_dispatch' && inputs.installers
        run: pnpm exec electron-builder --config electron-builder.config.cjs --publish never
      - name: Upload requested installers
        if: github.event_name == 'workflow_dispatch' && inputs.installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          retention-days: 3
          overwrite: true
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/*.png
            playwright-report/
            test-results/
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore

  complete:
    name: CI
    if: always()
    needs: [checks, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check required results
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          NATIVE_REQUIRED: ${{ needs.checks.outputs.native }}
          NATIVE_RESULT: ${{ needs.verify.result }}
        run: node scripts/ci-policy.cjs gate
