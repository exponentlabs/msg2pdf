[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "msg2pdf"
version = "0.1.0"
description = "Bulk convert MSG and EML emails and Office files to PDF."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "extract-msg>=0.56.1,<0.57",
    "WeasyPrint>=70,<71",
    "psutil>=7,<8",
    "beautifulsoup4>=4.15,<5",
    "tinycss2>=1.5,<2",
]

[project.optional-dependencies]
test = [
    "pypdf>=5",
    "pytest>=8",
]

[project.scripts]
msg2pdf = "msg2pdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[dependency-groups]
dev = ["build>=1.2,<2", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
